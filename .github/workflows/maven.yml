
name: Build, SonarQube Analysis and Tomcat Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux]

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Check Maven installation
      - name: Check Maven
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            echo "Maven is not installed on the runner."
            exit 1
          fi
          mvn -version

      # 4. Build application
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 5. SonarQube analysis
      - name: SonarQube Analysis
        env:
          SONAR_HOST: ${{ secrets.SONAR_HOST }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "Running SonarQube analysis..."

          mvn sonar:sonar \
            -Dsonar.projectKey=hotstar \
            -Dsonar.host.url="$SONAR_HOST" \
            -Dsonar.token="$SONAR_TOKEN"

      # 6. Upload WAR artifact
      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: target/*.war
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      # 1. Download WAR artifact
      - name: Download WAR artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp
          path: .

      # 2. Deploy WAR to Tomcat
      - name: Deploy to Tomcat
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e

          WAR_COUNT=$(find . -maxdepth 1 -name '*.war' | wc -l)

          if [ "$WAR_COUNT" -ne 1 ]; then
            echo "Expected exactly one WAR file, found $WAR_COUNT"
            exit 1
          fi

          WAR_FILE=$(find . -maxdepth 1 -name '*.war' -print -quit)

          echo "Deploying $WAR_FILE to Tomcat..."

          curl --fail --show-error --silent \
            --user "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "https://${TOMCAT_HOST}/manager/text/deploy?path=/myapp&update=true"

      # 3. Verify deployment
      - name: Verify deployment
        env:
          TOMCAT_HOST: ${{ secrets.TOMCAT_HOST }}
        run: |
          echo "Verifying application deployment..."

          curl --fail --show-error --silent \
            --output /dev/null \
            --write-out "HTTP Status: %{http_code}\n" \
            "https://${TOMCAT_HOST}/myapp"
